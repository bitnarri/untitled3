name: Vanilla Web Server Continuous Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy-to-server:
    runs-on: ubuntu-latest

    steps:
      # 1. 가상 머신에 현재 소스코드 다운로드
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. 마켓플레이스의 SSH 배포 액션을 사용하여 서버에 접속 후 파일 전송 및 명령 실행
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -eu
            echo "=== 배포 시작 ==="
            if [ ! -d "$HOME/vanilla-web/.git" ]; then
              rm -rf "$HOME/vanilla-web"
              git clone "https://github.com/bitnarri/untitled3.git" "$HOME/vanilla-web"
            fi
            cd "$HOME/vanilla-web"
            git fetch --all
            git reset --hard origin/main
            sudo dnf install -y nginx
            sudo install -d -o nginx -g nginx /var/www/vanilla-web
            sudo cp -R ./* /var/www/vanilla-web/
            sudo tee /etc/nginx/conf.d/vanilla-web.conf > /dev/null <<'NGINX'
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name _;
                root /var/www/vanilla-web;
                index index.html;
                location / {
                    try_files $uri $uri/ =404;
                }
            }
            NGINX
            sudo nginx -t
            sudo systemctl enable --now nginx
            sudo systemctl reload nginx
            echo "=== 배포 완료 ==="
